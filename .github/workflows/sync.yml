name: Auto Sync Fork

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fork with Upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 自动识别当前 Fork 仓库对应的上游及默认主分支并同步
          gh repo sync ${{ github.repository }} --force
